<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none">
  <!-- Stylized Cursive / Script "From Anywhere to Everywhere" with arrow -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&display=swap');
      .script-text {
        font-family: 'Caveat', 'Dancing Script', cursive;
        font-size: 26px;
        font-weight: 700;
        fill: #1A2838;
      }
      .accent-green {
        fill: #138848;
      }
    </style>
  </defs>

  <g transform="rotate(-6 110 45)">
    <text x="15" y="32" class="script-text">From Anywhere</text>
    <text x="50" y="62" class="script-text accent-green">to Everywhere</text>
    
    <!-- Curved playful arrow pointing downward left toward the logistics scene -->
    <path d="M 185 55 Q 200 70 170 82" stroke="#138848" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 170 82 L 176 74 M 170 82 L 180 82" stroke="#138848" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
