<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" class="w-full h-full">
  <defs>
    <!-- Deep atmospheric fuselage gradient matching twilight background -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1e2c3e" />
      <stop offset="45%" stop-color="#14202e" />
      <stop offset="100%" stop-color="#0a121c" />
    </linearGradient>

    <!-- Wing gradient with subtle ambient light -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#2a3c54" />
      <stop offset="100%" stop-color="#0f1926" />
    </linearGradient>

    <!-- Sunset ambient rim light matching the orange/gold sunset horizon in hero_hd.jpg -->
    <linearGradient id="sunsetRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#f8fafc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle atmospheric condensation contrail trail -->
    <linearGradient id="subtleContrail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#f1f5f9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Extremely subtle atmospheric contrail lines blending into distance -->
  <line x1="0" y1="48" x2="120" y2="48" stroke="url(#subtleContrail)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="10" y1="54" x2="148" y2="54" stroke="url(#subtleContrail)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Far Wing (Port side) -->
  <polygon points="120,38 175,18 190,18 165,38" fill="#111c28" />
  <!-- Far Engine Nacelle -->
  <ellipse cx="152" cy="26" rx="12" ry="3.5" fill="#0c1520" />

  <!-- Far Horizontal Tailplane -->
  <polygon points="28,34 52,22 62,22 46,35" fill="#0e1722" />

  <!-- Main Cargo Fuselage: Sleek, long aerodynamic freighter body heading right-downward -->
  <path d="M 22,37
           C 40,36 65,35 110,35
           C 165,35 220,36 252,41
           C 264,43 270,45.5 272,48
           C 270,51 260,53.5 246,55
           C 205,58 145,58 90,54
           C 55,51 35,44 22,37 Z"
        fill="url(#fuselageGrad)" />

  <!-- Sunset Rim Glint along upper fuselage spine -->
  <path d="M 90,35 C 150,35 215,36 250,41 C 262,43 268,45.5 271,48"
        stroke="url(#sunsetRim)" stroke-width="1.4" fill="none" />

  <!-- Cockpit Windshield (Subtle dark blue reflection) -->
  <path d="M 256,42.5 C 262,44 266,46 267,47.5 L 264,48 C 261,46.5 258,45 253,44 Z"
        fill="#38bdf8" opacity="0.65" />

  <!-- Vertical Stabilizer (Tall swept tail fin) -->
  <polygon points="22,37 50,7 66,7 56,36" fill="url(#wingGrad)" />
  <!-- Tail fin leading edge ambient glint -->
  <polygon points="22,37 50,7 53,7 28,37" fill="url(#sunsetRim)" opacity="0.6" />

  <!-- Near Horizontal Tailplane -->
  <polygon points="24,38 48,46 58,46 38,38" fill="#182535" />

  <!-- Near Wing (Starboard swept wing extending forward-downward with aerodynamic sweep) -->
  <polygon points="128,49 190,73 206,72 208,68 170,49" fill="url(#wingGrad)" />
  <!-- Wingtip raked sharklet / winglet -->
  <polygon points="204,72 210,63 207,63 201,72" fill="#223348" />
  <!-- Wing leading edge rim highlight -->
  <line x1="128" y1="49" x2="206" y2="72" stroke="url(#sunsetRim)" stroke-width="1.2" opacity="0.5" />

  <!-- Near Engine Pylon and High-Bypass Turbofan Nacelle -->
  <polygon points="156,53 162,58 152,58 148,53" fill="#0d1622" />
  <ellipse cx="157" cy="58" rx="16" ry="5.5" fill="#152232" />
  <!-- Engine Intake Ring (facing forward-right) -->
  <ellipse cx="171" cy="58" rx="3.2" ry="5.2" fill="#25384e" />
  <ellipse cx="171" cy="58" rx="2" ry="4" fill="#0d141e" />
  <!-- Engine Exhaust Cone -->
  <ellipse cx="142" cy="58" rx="2.5" ry="4.2" fill="#080c12" />
</svg>
